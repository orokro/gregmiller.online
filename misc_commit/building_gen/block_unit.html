<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Unit Generator</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="sidebar">
        <h2>Block Unit Settings</h2>
        
        <div class="control-group">
            <label for="seed">Unit Seed:</label>
            <input type="text" id="seed" value="unit_alpha">
        </div>

        <div class="control-group">
            <label for="blockLength">Unit Length (X):</label>
            <input type="number" id="blockLength" value="10.0" step="0.1" min="0.5">
            <small style="color: #888;">(Draggable)</small>
        </div>

        <div class="control-group">
            <label for="blockWidth">Unit Width (Z):</label>
            <input type="number" id="blockWidth" value="6.56" step="0.1" min="0.5">
            <small style="color: #888;">(Draggable)</small>
        </div>

        <div class="control-group">
            <label for="tallBlock" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="tallBlock" checked> Tall Mode
            </label>
        </div>

        <div class="control-group">
            <label for="hdrIntensity">HDR Intensity:</label>
            <input type="range" id="hdrIntensity" min="0" max="2" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <button id="regenerate">Full Regenerate</button>
        </div>

        <div class="control-group" style="flex-grow: 1; display: flex; flex-direction: column;">
            <label for="settingsJson">Building Defaults (JSON):</label>
            <textarea id="settingsJson"></textarea>
        </div>
    </div>

    <script type="module" src="src/main_blockunit.js"></script>
</body>
</html>
