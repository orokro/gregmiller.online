<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Monarch Butterfly (Smooth Constant-Speed Bezier Flight)</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		background: #0b1020;
		overflow: hidden;
	}
	canvas {
		display: block;
		width: 100vw;
		height: 100vh;
	}
	.hint {
		position: fixed;
		left: 12px;
		bottom: 12px;
		color: rgba(255,255,255,0.75);
		font: 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
		user-select: none;
	}
	.kbd {
		padding: 2px 6px;
		border: 1px solid rgba(255,255,255,0.25);
		border-radius: 6px;
		background: rgba(255,255,255,0.06);
	}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">
	Click to pick a new point • <span class="kbd">Space</span> to randomize • Tuned for steadier speed 🦋
</div>

<script>
(() => {
	'use strict';

	const canvas = document.getElementById('c');
	const ctx = canvas.getContext('2d', { alpha: false });

	const TAU = Math.PI * 2;

	const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
	const lerp = (a, b, t) => a + (b - a) * t;

	const wrapAngle = (a) => {
		while (a <= -Math.PI) a += TAU;
		while (a > Math.PI) a -= TAU;
		return a;
	};

	const lerpAngle = (a, b, t) => {
		let d = wrapAngle(b - a);
		return a + d * t;
	};

	const rand = (a, b) => a + Math.random() * (b - a);

	const vec = (x=0, y=0) => ({ x, y });
	const vAdd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
	const vSub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
	const vMul = (a, s) => ({ x: a.x * s, y: a.y * s });
	const vLen = (a) => Math.hypot(a.x, a.y);
	const vNorm = (a) => {
		const l = vLen(a) || 1;
		return { x: a.x / l, y: a.y / l };
	};
	const vDot = (a, b) => a.x * b.x + a.y * b.y;

	const resize = () => {
		const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
		canvas.width = Math.floor(innerWidth * dpr);
		canvas.height = Math.floor(innerHeight * dpr);
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	};
	addEventListener('resize', resize);
	resize();

	// Cubic Bézier helpers
	const bezierPoint = (p0, p1, p2, p3, t) => {
		const u = 1 - t;
		const tt = t * t;
		const uu = u * u;
		const uuu = uu * u;
		const ttt = tt * t;
		return {
			x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
			y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
		};
	};

	const bezierTangent = (p0, p1, p2, p3, t) => {
		const u = 1 - t;
		const a = vMul(vSub(p1, p0), 3 * u * u);
		const b = vMul(vSub(p2, p1), 6 * u * t);
		const c = vMul(vSub(p3, p2), 3 * t * t);
		return vAdd(vAdd(a, b), c);
	};

	// Robust constant-speed stepping:
	// - move by ds pixels
	// - approximate dt = ds / |dP/dt|
	// - clamp dt to avoid big jumps (which look like speed pulses)
	// - do multiple substeps per frame
	const advanceBezierByDistance = (curve, t, dist) => {
		let tt = t;
		let remaining = dist;

		// Keep increments small so the "local derivative" approximation stays accurate.
		// This is what removes the visible speed-up/slow-down on different curve shapes.
		const MAX_DT = 0.015;

		// Safety to prevent infinite loops if something goes odd.
		for (let guard = 0; guard < 32 && remaining > 0 && tt < 1; guard++) {
			const tan = bezierTangent(curve.p0, curve.p1, curve.p2, curve.p3, tt);
			const tanLen = Math.max(1e-3, vLen(tan));

			let dtParam = remaining / tanLen;
			dtParam = Math.min(dtParam, MAX_DT);

			const tNext = Math.min(1, tt + dtParam);

			// Refine step using chord length (better than pure derivative step)
			const pA = bezierPoint(curve.p0, curve.p1, curve.p2, curve.p3, tt);
			const pB = bezierPoint(curve.p0, curve.p1, curve.p2, curve.p3, tNext);
			const moved = vLen(vSub(pB, pA));

			// If we didn't move meaningfully (degenerate), just advance a hair.
			if (moved < 1e-4) {
				tt = tNext;
				remaining = 0;
				break;
			}

			// Scale remaining distance by what actually happened.
			// moved corresponds to dtParam; if moved < remaining, subtract and continue.
			remaining = Math.max(0, remaining - moved);
			tt = tNext;
		}

		return tt;
	};

	// Flight state
	const state = {
		pos: vec(innerWidth * 0.5, innerHeight * 0.5),
		angle: rand(-Math.PI, Math.PI),

		// Make it slower and steadier
		speed: 90,				// current speed (px/s)
		targetSpeed: 90,			// desired speed (px/s)

		target: vec(innerWidth * 0.7, innerHeight * 0.5),
		curve: null,
		curveT: 0,
		lastPickAt: 0
	};

	const pickTarget = (x, y) => {
		const w = innerWidth;
		const h = innerHeight;

		state.target = vec(
			clamp(x ?? rand(40, w - 40), 40, w - 40),
			clamp(y ?? rand(40, h - 40), 40, h - 40)
		);

		const p0 = { x: state.pos.x, y: state.pos.y };
		const heading = { x: Math.cos(state.angle), y: Math.sin(state.angle) };

		const toT = vSub(state.target, state.pos);
		const dist = vLen(toT);

		const c1Len = clamp(dist * 0.35, 90, 260);
		const c2Len = clamp(dist * 0.25, 80, 220);

		// Starts parallel to current heading
		const p1 = vAdd(p0, vMul(heading, c1Len));

		const toDir = vNorm(toT);
		const side = { x: -toDir.y, y: toDir.x };

		const sweepSign = (Math.random() < 0.5) ? -1 : 1;
		const sweepAmt = clamp(dist * 0.16, 30, 140) * sweepSign;

		const mix = clamp(0.35 + 0.25 * (1 - Math.abs(vDot(heading, toDir))), 0.25, 0.75);
		const approach = vNorm(vAdd(vMul(toDir, 1 - mix), vMul(heading, mix)));

		const p3 = { x: state.target.x, y: state.target.y };
		let p2 = vSub(p3, vMul(approach, c2Len));
		p2 = vAdd(p2, vMul(side, sweepAmt));

		state.curve = { p0, p1, p2, p3 };
		state.curveT = 0;
		state.lastPickAt = performance.now();

		// Tiny, smooth speed variation target (optional, but subtle)
		state.targetSpeed = clamp(80 + Math.random() * 30, 70, 110);
	};

	pickTarget();

	addEventListener('pointerdown', (e) => pickTarget(e.clientX, e.clientY));
	addEventListener('keydown', (e) => {
		if (e.code === 'Space') {
			e.preventDefault();
			pickTarget();
		}
	});

	// Butterfly drawing (local coordinates, facing +X)
	const drawButterfly = (x, y, angle, t) => {
		ctx.save();
		ctx.translate(x, y);
		ctx.rotate(angle);

		const flutter = Math.sin(t * 10.0) * 0.25 + Math.sin(t * 6.2) * 0.12;
		const wingOpen = 0.70 + 0.25 * Math.sin(t * 9.0 + 0.7);

		ctx.translate(0, Math.sin(t * 5.2) * 1.6);

		// Body
		ctx.fillStyle = '#1a1a1a';
		roundOval(0, 0, 38, 10);
		ctx.fill();

		// Thorax highlight
		ctx.fillStyle = 'rgba(255,255,255,0.10)';
		roundOval(6, -1, 16, 6);
		ctx.fill();

		// Antennae
		ctx.strokeStyle = '#111';
		ctx.lineWidth = 2;
		ctx.lineCap = 'round';
		ctx.beginPath();
		ctx.moveTo(18, -2);
		ctx.quadraticCurveTo(30, -12, 40, -14);
		ctx.moveTo(18, 2);
		ctx.quadraticCurveTo(30, 12, 40, 14);
		ctx.stroke();

		// Antennae tips
		ctx.fillStyle = '#111';
		roundOval(41, -14, 4, 4);
		ctx.fill();
		roundOval(41, 14, 4, 4);
		ctx.fill();

		drawWingSide(wingOpen, flutter, 1);
		drawWingSide(wingOpen, flutter, -1);

		ctx.restore();
	};

	const roundOval = (cx, cy, rx, ry) => {
		ctx.beginPath();
		ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
	};

	const drawWingSide = (wingOpen, flutter, side) => {
		ctx.save();
		ctx.scale(1, side);

		ctx.translate(-2, 0);

		const flap = (0.45 + 0.55 * wingOpen) * 0.9;
		ctx.rotate(0.55 * flap + flutter * 0.15);
		ctx.scale(1, 0.95 + 0.08 * Math.sin(flutter * 4));

		ctx.fillStyle = '#f28c1b';
		ctx.strokeStyle = '#121212';
		ctx.lineWidth = 3;

		ctx.beginPath();
		ctx.ellipse(-6, -16, 34, 22, -0.25, 0, TAU);
		ctx.ellipse(-10, 18, 28, 18, 0.25, 0, TAU);
		ctx.fill();
		ctx.stroke();

		ctx.strokeStyle = '#0f0f0f';
		ctx.lineWidth = 5;
		ctx.beginPath();
		ctx.ellipse(-6, -16, 34, 22, -0.25, 0, TAU);
		ctx.stroke();
		ctx.beginPath();
		ctx.ellipse(-10, 18, 28, 18, 0.25, 0, TAU);
		ctx.stroke();

		ctx.fillStyle = '#f3f3f3';
		for (let i = 0; i < 7; i++) {
			const a = lerp(-1.05, 0.25, i / 6);
			const px = -6 + Math.cos(a) * 30;
			const py = -16 + Math.sin(a) * 18;
			ctx.beginPath();
			ctx.ellipse(px, py, 2.2, 1.8, a * 0.2, 0, TAU);
			ctx.fill();
		}
		for (let i = 0; i < 6; i++) {
			const a = lerp(0.55, 2.35, i / 5);
			const px = -10 + Math.cos(a) * 24;
			const py = 18 + Math.sin(a) * 14;
			ctx.beginPath();
			ctx.ellipse(px, py, 2.0, 1.6, a * 0.2, 0, TAU);
			ctx.fill();
		}

		ctx.strokeStyle = 'rgba(10,10,10,0.85)';
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.moveTo(6, 0);
		ctx.quadraticCurveTo(-12, -6, -34, -18);
		ctx.moveTo(6, 0);
		ctx.quadraticCurveTo(-8, -2, -26, -2);
		ctx.moveTo(6, 0);
		ctx.quadraticCurveTo(-10, 8, -30, 20);
		ctx.stroke();

		ctx.restore();
	};

	const drawBackground = () => {
		const w = innerWidth;
		const h = innerHeight;

		const g = ctx.createLinearGradient(0, 0, 0, h);
		g.addColorStop(0, '#0b1020');
		g.addColorStop(1, '#081328');

		ctx.fillStyle = g;
		ctx.fillRect(0, 0, w, h);

		const rg = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.2, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
		rg.addColorStop(0, 'rgba(0,0,0,0)');
		rg.addColorStop(1, 'rgba(0,0,0,0.55)');
		ctx.fillStyle = rg;
		ctx.fillRect(0, 0, w, h);
	};

	const drawTarget = () => {
		ctx.save();
		ctx.translate(state.target.x, state.target.y);

		ctx.fillStyle = '#33d17a';
		ctx.beginPath();
		ctx.arc(0, 0, 5, 0, TAU);
		ctx.fill();

		ctx.strokeStyle = 'rgba(51,209,122,0.35)';
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.arc(0, 0, 14, 0, TAU);
		ctx.stroke();

		ctx.restore();
	};

	const drawCurveGhost = () => {
		if (!state.curve) return;

		ctx.save();
		ctx.globalAlpha = 0.12;
		ctx.strokeStyle = '#7aa2ff';
		ctx.lineWidth = 2;

		const { p0, p1, p2, p3 } = state.curve;
		ctx.beginPath();
		ctx.moveTo(p0.x, p0.y);
		ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
		ctx.stroke();

		ctx.restore();
	};

	let last = performance.now();

	const step = (now) => {
		const dt = clamp((now - last) / 1000, 0, 0.033);
		last = now;

		// Smoothly approach targetSpeed (no sinusoid “surges”)
		const speedSmooth = 1 - Math.pow(0.001, dt);
		state.speed = lerp(state.speed, state.targetSpeed, speedSmooth);

		// Auto-pick so it never “arrives and stops”
		const sincePick = (now - state.lastPickAt) / 1000;
		const nearingEnd = state.curve ? state.curveT > 0.86 : false;

		if (sincePick > rand(1.8, 3.2) || nearingEnd) {
			const forward = { x: Math.cos(state.angle), y: Math.sin(state.angle) };
			const ahead = vAdd(state.pos, vMul(forward, rand(140, 260)));
			pickTarget(
				ahead.x + rand(-220, 220),
				ahead.y + rand(-180, 180)
			);
		}

		// Constant-speed curve following
		if (state.curve) {
			// More substeps = smoother and more constant-looking speed
			const subSteps = 4;
			const ds = (state.speed * dt) / subSteps;

			for (let i = 0; i < subSteps; i++) {
				state.curveT = advanceBezierByDistance(state.curve, state.curveT, ds);

				const p = bezierPoint(state.curve.p0, state.curve.p1, state.curve.p2, state.curve.p3, state.curveT);
				state.pos.x = p.x;
				state.pos.y = p.y;

				const tan = bezierTangent(state.curve.p0, state.curve.p1, state.curve.p2, state.curve.p3, state.curveT);
				const targetAngle = Math.atan2(tan.y, tan.x);

				// Smooth turning (extra slow-turn cap)
				const turnSmooth = 1 - Math.pow(0.00025, dt);
				state.angle = lerpAngle(state.angle, targetAngle, turnSmooth);
			}

			if (state.curveT >= 1) {
				pickTarget();
			}
		}

		drawBackground();
		drawTarget();
		drawCurveGhost();
		drawButterfly(state.pos.x, state.pos.y, state.angle, now * 0.001);

		requestAnimationFrame(step);
	};

	requestAnimationFrame(step);
})();
</script>
</body>
</html>
