<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Generator</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="sidebar">
        <h2>Garden Settings</h2>
        
        <div class="control-group">
            <label for="hdrIntensity">HDR Intensity:</label>
            <input type="number" id="hdrIntensity" value="1.0" step="0.1" min="0">
        </div>

        <hr>
        <h3>Ground Plane</h3>
        <div class="control-group">
            <label for="groundWidth">Width (X):</label>
            <input type="number" id="groundWidth" value="10" step="0.5" min="0.1">
        </div>
        <div class="control-group">
            <label for="groundHeight">Height (Y):</label>
            <input type="number" id="groundHeight" value="10" step="0.5" min="0.1">
        </div>

    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
