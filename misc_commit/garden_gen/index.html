<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Generator</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="sidebar">
        <h2>Garden Settings</h2>
        
        <div class="control-group">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="wireframe" checked> Show Wireframes
            </label>
        </div>

        <div class="control-group">
            <label for="hdrIntensity">HDR Intensity:</label>
            <input type="number" id="hdrIntensity" value="1.0" step="0.1" min="0">
        </div>

        <hr>
        <h3>Ground Plane</h3>
        <div class="control-group">
            <label for="groundWidth">Width (X):</label>
            <input type="number" id="groundWidth" value="18" step="0.5" min="0.1">
        </div>
        <div class="control-group">
            <label for="groundHeight">Height (Y):</label>
            <input type="number" id="groundHeight" value="15" step="0.5" min="0.1">
        </div>

        <hr>
        <h3>Grass Shader</h3>
        <div class="control-group">
            <label for="grassDensity">Density:</label>
            <input type="number" id="grassDensity" value="50000" step="1000" min="0">
        </div>
        <div class="control-group">
            <label for="bladeMinLength">Min Length:</label>
            <input type="number" id="bladeMinLength" value="0.2" step="0.05" min="0">
        </div>
        <div class="control-group">
            <label for="bladeMaxLength">Max Length:</label>
            <input type="number" id="bladeMaxLength" value="0.5" step="0.05" min="0">
        </div>
        <div class="control-group">
            <label for="bladeMinWidth">Min Width:</label>
            <input type="number" id="bladeMinWidth" value="0.02" step="0.01" min="0">
        </div>
        <div class="control-group">
            <label for="bladeMaxWidth">Max Width:</label>
            <input type="number" id="bladeMaxWidth" value="0.05" step="0.01" min="0">
        </div>
        <div class="control-group">
            <label for="bladeMinTipWidth">Min Tip Width:</label>
            <input type="number" id="bladeMinTipWidth" value="0.0" step="0.01" min="0">
        </div>
        <div class="control-group">
            <label for="bladeMaxTipWidth">Max Tip Width:</label>
            <input type="number" id="bladeMaxTipWidth" value="0.01" step="0.01" min="0">
        </div>
        <div class="control-group">
            <label for="bladeSegments">Segments:</label>
            <input type="number" id="bladeSegments" value="4" step="1" min="1">
        </div>
        <div class="control-group">
            <label for="bendIntensity">Bend Intensity:</label>
            <input type="number" id="bendIntensity" value="0.5" step="0.1" min="0">
        </div>
        <div class="control-group">
            <label for="noiseScale">Noise Scale:</label>
            <input type="number" id="noiseScale" value="2.0" step="0.1" min="0.1">
        </div>
        <div class="control-group">
            <label for="windIntensity">Wind Intensity:</label>
            <input type="number" id="windIntensity" value="0.3" step="0.1" min="0">
        </div>
        <div class="control-group">
            <label for="windX">Wind X:</label>
            <input type="number" id="windX" value="1.0" step="0.1">
        </div>
        <div class="control-group">
            <label for="windY">Wind Y:</label>
            <input type="number" id="windY" value="1.0" step="0.1">
        </div>
        <div class="control-group">
            <label for="planeColor">Plane (Dirt) Color:</label>
            <input type="color" id="planeColor" value="#3d2b1f">
        </div>
        <div class="control-group">
            <label for="grassColor1">Grass Color 1:</label>
            <input type="color" id="grassColor1" value="#4da83b">
        </div>
        <div class="control-group">
            <label for="grassColor2">Grass Color 2:</label>
            <input type="color" id="grassColor2" value="#83da4a">
        </div>

        <hr>
        <h3>Prisms</h3>
        <div class="control-group">
            <label for="prismWidth">Width (X):</label>
            <input type="number" id="prismWidth" value="10" step="0.5" min="0.1">
        </div>
        <div class="control-group">
            <label for="prismDepth">Depth (Z):</label>
            <input type="number" id="prismDepth" value="5" step="0.5" min="0.1">
        </div>
        <div class="control-group">
            <label for="prismSpacing">Spacing:</label>
            <input type="number" id="prismSpacing" value="2" step="0.5">
        </div>
        <div class="control-group">
            <label for="prismHeights">Heights (CSV):</label>
            <input type="text" id="prismHeights" value="10, 6, 7" style="cursor: text;">
        </div>

        <hr>
        <h3>Settings JSON</h3>
        <div class="control-group">
            <label for="gardenSettings">Garden System Settings:</label>
            <textarea id="gardenSettings">{
  "snails": {
    "density": 10,
    "minScale": 0.5,
    "maxScale": 1.2,
    "seed": "snail_v1",
    "yOffset": 0.1,
    "randomRotation": true
  },
  "flowers": {
    "density": 30,
    "minScale": 0.8,
    "maxScale": 1.5,
    "seed": "flower_v1",
    "yOffset": 0.0,
    "randomRotation": true
  },
  "leaves": {
    "density": 50,
    "minScale": 0.3,
    "maxScale": 0.8,
    "seed": "leaf_v1",
    "yOffset": 0.0,
    "randomRotation": true
  }
}</textarea>
        </div>
        <div class="control-group">
            <label for="blockSettings">Garden Block Settings:</label>
            <textarea id="blockSettings">{
  "blockScaleSize": 1.0,
  "overScaleDepth": 1.1,
  "centerScaler": 1.666666667,
  "uvScale": 1.0,
  "reprojectUVs": true
}</textarea>
        </div>

    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
